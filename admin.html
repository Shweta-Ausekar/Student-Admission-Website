<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Admission Admin Panel</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .refresh-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #1d4ed8;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f1f5f9;
        }

        .view-btn {
            background: #16a34a;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
        }

        .message {
            text-align: center;
            padding: 30px;
            color: #666;
        }

    </style>

</head>


<body>


<header>

    <h1>
        🎓 Student Admission Admin Panel
    </h1>

</header>


<div class="container">


    <div class="top">

        <div>

            <h2>
                Admission Applications
            </h2>

            <p>
                View submitted student applications
            </p>

        </div>


        <button
            class="refresh-btn"
            onclick="loadAdmissions()">

            Refresh

        </button>

    </div>



    <div class="card">


        <table>


            <thead>

                <tr>

                    <th>
                        Application ID
                    </th>

                    <th>
                        Student Name
                    </th>

                    <th>
                        Email
                    </th>

                    <th>
                        Phone
                    </th>

                    <th>
                        Course
                    </th>

                    <th>
                        Percentage
                    </th>

                    <th>
                        Previous School
                    </th>

                    <th>
                        Submitted At
                    </th>

                    <th>
                        Marksheet
                    </th>

                </tr>

            </thead>


            <tbody id="admissionTable">

                <tr>

                    <td
                        colspan="9"
                        class="message">

                        Loading admissions...

                    </td>

                </tr>

            </tbody>


        </table>


    </div>


</div>



<script>

async function loadAdmissions() {


    const table =
        document.getElementById(
            "admissionTable"
        );


    table.innerHTML = `

        <tr>

            <td
                colspan="9"
                class="message">

                Loading admissions...

            </td>

        </tr>

    `;


    try {


        const response =
            await fetch(
                "/api/admissions"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to load admissions."
            );

        }


        if (
            !data.admissions ||
            data.admissions.length === 0
        ) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="9"
                        class="message">

                        No admission records found.

                    </td>

                </tr>

            `;

            return;

        }


        table.innerHTML = "";


        data.admissions.forEach(
            function(student) {


                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${student.applicationId}
                    </td>

                    <td>
                        ${student.fullName}
                    </td>

                    <td>
                        ${student.email}
                    </td>

                    <td>
                        ${student.phone}
                    </td>

                    <td>
                        ${student.course}
                    </td>

                    <td>
                        ${student.percentage}%
                    </td>

                    <td>
                        ${student.previousSchool}
                    </td>

                    <td>
                        ${new Date(
                            student.submittedAt
                        ).toLocaleString()}
                    </td>

                    <td>

                        <a
                            class="view-btn"
                            href="/uploads/${student.marksheet}"
                            target="_blank">

                            View

                        </a>

                    </td>

                `;


                table.appendChild(row);


            }
        );


    }

    catch (error) {


        console.error(error);


        table.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="message">

                    Error:
                    ${error.message}

                </td>

            </tr>

        `;

    }

}



loadAdmissions();

</script>


</body>

</html>
